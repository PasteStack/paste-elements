// Standalone marquee example. Paths resolve against the repository root, which
// is the working directory the example build runs the compiler from.
//
// The core `paste` modules live outside this repository, so the build script
// appends `include-paths` from the PASTE_CORE_JS environment variable and writes
// the result to target/marquee-example.conf. Run the compiler against that file,
// never against this one directly.
source.scss = "modules/marquee"
source.js = "modules/marquee"
source.images = "examples/images"
output.base = "target/marquee-example"
output.js = "target/marquee-example/js"
output.css = "target/marquee-example/css"
output.images = "target/marquee-example/images"
manifest = "target/marquee-example/manifest.json"
minify = true
source-maps = false
jam.enabled = false
