include:
  - project: 'tomshley/brands/global/tware/tech/products/provisioning/cicd-pipelines'
    ref: 'v0.9.1'
    file: '/adapters/gitlab/ci/adapter.yml'

variables:
  CICD_PIPELINES_RUNNER_TAG: "0.9.1"
  BASE_CONTAINERS_REGISTRY: registry.gitlab.com/tomshley/brands/global/tware/tech/products/provisioning/base-containers
  BASE_CONTAINERS_UPSTREAM_TAG: "0.6.0"

# Branch and tag pipelines carry the build; merge request pipelines would only
# duplicate them (the adapter's workflow admits both), so they are skipped here.
# Tag pipelines must keep these jobs: the publish job declares `needs` on them.
.runs-on-branch-or-tag:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

package-source:
  extends: [.runs-on-branch-or-tag]
  image: alpine:3.21.3
  stage: build
  script:
    - test -d base
    - test -d modules
    - mkdir -p target
    - tar -czf "target/paste-elements-${CI_COMMIT_SHA}.tar.gz" base modules structure README.md LICENSE NOTICE.md VERSION
  artifacts:
    paths: [target/paste-elements-*.tar.gz]
    expire_in: 1 day

test:
  extends: [.runs-on-branch-or-tag]
  image: node:22.14.0-bookworm
  stage: test
  needs: [package-source]
  variables:
    # The paste core revision the suite and the fixture host run against.
    # It is pinned so a branch or tag pipeline always tests the same core
    # bytes; bump it deliberately, in its own change, after the suite
    # passes against the new core revision.
    PASTE_CORE_SHA: "1887086de7d0aa37714a7a0f2ac6e1508cc3aefd"
  script:
    # Every shipped module must parse; naming individual modules let new ones
    # ship unchecked. The suite helpers the tests load parse the same way.
    - find modules -name '*.js' -print0 | xargs -0 -n1 node --check
    - find tests -name '*.cjs' -print0 | xargs -0 -n1 node --check
    # The core-dependent suites (the fake/real event parity check and the
    # fixture host check) fail without PASTE_CORE_JS, so the dependency is
    # established here, not assumed. Exactly the pinned commit is fetched,
    # never a moving branch. The core project is public, so the fetch is
    # anonymous: no job token or other credential is sent with it. The
    # clone lands inside the checkout's ignored target/ directory — a path
    # outside the project would depend on the runner's workspace layout.
    - git init --quiet "$CI_PROJECT_DIR/target/paste"
    - git -C "$CI_PROJECT_DIR/target/paste" remote add origin "https://gitlab.com/tomshley/brands/global/tware/tech/products/paste/paste.git"
    - git -C "$CI_PROJECT_DIR/target/paste" fetch --quiet --depth 1 origin "$PASTE_CORE_SHA"
    - git -C "$CI_PROJECT_DIR/target/paste" checkout --quiet --detach FETCH_HEAD
    - echo "paste core under test at $(git -C "$CI_PROJECT_DIR/target/paste" rev-parse HEAD)"
    - test "$(git -C "$CI_PROJECT_DIR/target/paste" rev-parse HEAD)" = "$PASTE_CORE_SHA"
    - export PASTE_CORE_JS="$CI_PROJECT_DIR/target/paste/src/js"
    # The Element behaviour checks are the repository's own suite (Node's test
    # runner, no dependencies). Running them here is what keeps them honest.
    - node --test 'tests/*.test.cjs'

publish:
  extends: [.tomshley-cicd-publish-generic]
  needs: [package-source, test]
  variables:
    TOMSHLEY_CICD_GENERIC_PACKAGE: paste-elements
    TOMSHLEY_CICD_GENERIC_ARTIFACT: target/paste-elements-${CI_COMMIT_SHA}.tar.gz
