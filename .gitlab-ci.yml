include:
  - project: 'tomshley/brands/global/tware/tech/products/provisioning/cicd-pipelines'
    ref: 'v0.9.1'
    file: '/adapters/gitlab/ci/adapter.yml'

variables:
  CICD_PIPELINES_RUNNER_TAG: "0.9.1"
  BASE_CONTAINERS_REGISTRY: registry.gitlab.com/tomshley/brands/global/tware/tech/products/provisioning/base-containers
  BASE_CONTAINERS_UPSTREAM_TAG: "0.6.0"

# Branch and tag pipelines carry the build; merge request pipelines would only
# duplicate them (the adapter's workflow admits both), so they are skipped here.
# Tag pipelines must keep these jobs: the publish job declares `needs` on them.
.runs-on-branch-or-tag:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

package-source:
  extends: [.runs-on-branch-or-tag]
  image: alpine:3.21.3
  stage: build
  script:
    - test -d base
    - test -d modules
    - mkdir -p target
    - tar -czf "target/paste-elements-${CI_COMMIT_SHA}.tar.gz" base modules structure README.md LICENSE NOTICE VERSION
  artifacts:
    paths: [target/paste-elements-*.tar.gz]
    expire_in: 1 day

test:
  extends: [.runs-on-branch-or-tag]
  image: node:22.14.0-bookworm
  stage: test
  needs: [package-source]
  variables:
    # The paste core revision the suite and the fixture host run against.
    # It is pinned so a branch or tag pipeline always tests the same core
    # bytes; bump it deliberately, in its own change, after the suite
    # passes against the new core revision.
    PASTE_CORE_SHA: "1887086de7d0aa37714a7a0f2ac6e1508cc3aefd"
  script:
    # Every shipped module must parse; naming individual modules let new ones
    # ship unchecked. The suite helpers the tests load parse the same way.
    - find modules -name '*.js' -print0 | xargs -0 -n1 node --check
    - find tests -name '*.cjs' -print0 | xargs -0 -n1 node --check
    # The core-dependent suites (the fake/real event parity check and the
    # fixture host check) fail without PASTE_CORE_JS, so the dependency is
    # established here, not assumed. Exactly the pinned commit is fetched,
    # never a moving branch. The core project is public, so the fetch is
    # anonymous: no job token or other credential is sent with it. The
    # clone lands inside the checkout's ignored target/ directory — a path
    # outside the project would depend on the runner's workspace layout.
    - git init --quiet "$CI_PROJECT_DIR/target/paste"
    - git -C "$CI_PROJECT_DIR/target/paste" remote add origin "https://gitlab.com/tomshley/brands/global/tware/tech/products/paste/paste.git"
    - git -C "$CI_PROJECT_DIR/target/paste" fetch --quiet --depth 1 origin "$PASTE_CORE_SHA"
    - git -C "$CI_PROJECT_DIR/target/paste" checkout --quiet --detach FETCH_HEAD
    - echo "paste core under test at $(git -C "$CI_PROJECT_DIR/target/paste" rev-parse HEAD)"
    - test "$(git -C "$CI_PROJECT_DIR/target/paste" rev-parse HEAD)" = "$PASTE_CORE_SHA"
    - export PASTE_CORE_JS="$CI_PROJECT_DIR/target/paste/src/js"
    # Keep the complete gate's compiler, drivers and browser matrix reproducible.
    - apt-get update && apt-get install -y --no-install-recommends openjdk-17-jdk-headless unzip
    - npm install --prefix target/playwright --no-package-lock --ignore-scripts playwright@1.41.0 terser@5.50.0 sass@1.105.2
    - node target/playwright/node_modules/playwright/cli.js install-deps chromium firefox webkit
    - node target/playwright/node_modules/playwright/cli.js install firefox webkit
    - curl --fail --location --retry 3 https://storage.googleapis.com/chrome-for-testing-public/151.0.7922.34/linux64/chrome-headless-shell-linux64.zip -o target/chromium.zip
    - echo "3cfc2bd00d1bafcf8a68dc74c9c92bb7150ddc8d26ade948a776316e1cec4f14  target/chromium.zip" | sha256sum --check
    - unzip -q target/chromium.zip -d target
    - export ELEMENTS_CHROMIUM_EXECUTABLE="$CI_PROJECT_DIR/target/chrome-headless-shell-linux64/chrome-headless-shell"
    - export MARQUEE_CHROMIUM_EXECUTABLE="$ELEMENTS_CHROMIUM_EXECUTABLE"
    - export ELEMENTS_BROWSER_EXECUTABLE="$ELEMENTS_CHROMIUM_EXECUTABLE"
    - mkdir -p target/playwright-java
    - |
      for artifact in playwright driver driver-bundle; do
        curl --fail --location --retry 3 "https://repo.maven.apache.org/maven2/com/microsoft/playwright/$artifact/1.41.0/$artifact-1.41.0.jar" -o "target/playwright-java/$artifact.jar"
      done
    - curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/com/google/code/gson/gson/2.10.1/gson-2.10.1.jar -o target/playwright-java/gson.jar
    - curl --fail --location --retry 3 https://gitlab.com/api/v4/projects/76219588/packages/generic/paste-assetgraph/0.3.1/paste-assetgraph-linux-amd64-musl -o target/paste-assetgraph
    - echo "92222fd1ca5e6a23928d81d2c660a67aa1173aad9d9d47293658c429bd95ffdd  target/paste-assetgraph" | sha256sum --check
    - chmod +x target/paste-assetgraph
    - export PASTE_ASSETGRAPH_BIN="$CI_PROJECT_DIR/target/paste-assetgraph"
    - export PLAYWRIGHT_MODULE="$CI_PROJECT_DIR/target/playwright/node_modules/playwright"
    - export TERSER_MODULE="$CI_PROJECT_DIR/target/playwright/node_modules/terser"
    - export PASTE_SASS_MODULE="$CI_PROJECT_DIR/target/playwright/node_modules/sass"
    - export PLAYWRIGHT_JAVA_CLASSPATH="$CI_PROJECT_DIR/target/playwright-java/*"
    - bash tests/run-all-checks.sh
  artifacts:
    when: always
    paths: [target/all-checks/, target/browser-checks/, target/browser-checks-elements/, target/*-probes.json]
    expire_in: 7 days

publish:
  extends: [.tomshley-cicd-publish-generic]
  needs: [package-source, test]
  variables:
    TOMSHLEY_CICD_GENERIC_PACKAGE: paste-elements
    TOMSHLEY_CICD_GENERIC_ARTIFACT: target/paste-elements-${CI_COMMIT_SHA}.tar.gz
